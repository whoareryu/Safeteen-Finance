name: Sync Dev Server

on:
  push:
    branches:
      - main
      - mac
      - window
      - aws

concurrency:
  group: sync-dev-server
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Pull latest on remote server
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.REMOTE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="cloudflared access ssh --hostname ssh.whoareryu.cloud" \
              -i ~/.ssh/deploy_key \
              "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}" \
              "cd ~/cloud.whoareryu && git fetch origin && git pull origin \$(git branch --show-current)"
