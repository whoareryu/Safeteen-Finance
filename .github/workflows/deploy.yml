name: Deploy Backend

on:
  push:
    branches:
      - main
      - mac
    paths:
      - "fastapi/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 크로스 빌드용)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./fastapi
          file: ./fastapi/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: whoareryu/fastapi:latest

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Deploy to remote server
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.REMOTE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="cloudflared access ssh --hostname ssh.whoareryu.cloud" \
              -i ~/.ssh/deploy_key \
              "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}" \
              "cd ~/projects/cloud.whoareryu && docker compose -f docker-compose.backend.yaml pull && for c in whoareryu-backend whoareryu-n8n whoareryu-pgvector whoareryu-redis whoareryu-cloudflared whoareryu-adminer whoareryu-neo4j; do docker rm -f \"\$c\" 2>/dev/null || true; done && docker compose -f docker-compose.backend.yaml up -d && docker image prune -f"
