services:
  # 1. FastAPI 백엔드 설정
  backend:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: whoareryu-backend
    ports:
      - "8000:8000"
    volumes:
      - ./fastapi:/whoareryu
    env_file:
      - ./fastapi/.env
    environment:
      - AUTO_CREATE_TABLES=false
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - app-network

  # 2. Next.js 프런트엔드 설정
  frontend:
    build:
      context: ./www
      dockerfile: Dockerfile
    container_name: whoareryu-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./www:/app
      - /app/.next
      - /app/node_modules
    env_file:
      - ./www/.env.local
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - app-network

  # 3. n8n 워크플로우 자동화
  n8n:
    image: n8nio/n8n
    container_name: whoareryu-n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  n8n_data:
