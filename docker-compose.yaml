services:
  # 1. FastAPI 백엔드
  backend:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: whoareryu-backend
    ports:
      - "8000:8000"
    volumes:
      - ./fastapi:/whoareryu
    env_file:
      - ./fastapi/.env
    environment:
      - AUTO_CREATE_TABLES=false
      - DATABASE_URL=postgresql+asyncpg://postgres:whoareryu@pgvector:5432/whoareryu
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - OLLAMA_HOST=http://host.docker.internal:11434
      - N8N_API_URL=http://n8n:5678
      - N8N_HUB_WEBHOOK_URL=http://n8n:5678/webhook/ontology
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pgvector
      - redis
      - neo4j
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - app-network

  # 2. Next.js 프런트엔드
  frontend:
    build:
      context: ./www
      dockerfile: Dockerfile
    container_name: whoareryu-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./www:/app
      - /app/.next
      - /app/node_modules
    env_file:
      - ./www/.env.local
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - app-network

  # 3. n8n 워크플로우 자동화
  n8n:
    image: n8nio/n8n
    container_name: whoareryu-n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - app-network

  # 4. pgvector — Relational + Vector DB (PostgreSQL 17)
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: whoareryu-pgvector
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${PGVECTOR_USER:-postgres}
      - POSTGRES_PASSWORD=${PGVECTOR_PASSWORD:-postgres}
      - POSTGRES_DB=${PGVECTOR_DB:-whoareryu}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - app-network

  # 5. Redis — Cache / Queue
  redis:
    image: redis:7-alpine
    container_name: whoareryu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # 6. Cloudflare Named Tunnel (api.whoareryu.cloud → backend:8000)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: whoareryu-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network

  # 7. Adminer — DB 웹 GUI (localhost:8080)
  adminer:
    image: adminer
    container_name: whoareryu-adminer
    ports:
      - "8080:8080"
    depends_on:
      - pgvector
    networks:
      - app-network

  # 8. Neo4j — Graph DB
  neo4j:
    image: neo4j:5
    container_name: whoareryu-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
    volumes:
      - neo4j_data:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  n8n_data:
  pgvector_data:
  redis_data:
  neo4j_data:
