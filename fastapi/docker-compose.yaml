# pgvector/neo4j/cloudflared 의 ${...} 치환값은 이 파일과 같은 경로의 .env를 자동으로 읽지 않음.
# 실행 시 명시적으로 지정: docker compose --env-file fastapi/.env -f fastapi/docker-compose.yaml up
#
# name을 고정하지 않으면 compose가 실행 디렉터리 이름으로 프로젝트명을 정한다 — 예전엔
# 저장소 루트(cloud.whoareryu/)에서 실행해 "cloudwhoareryu"였는데, fastapi/ 안에서 실행하면
# "fastapi"가 되어 기존 컨테이너와 이름이 충돌한다. 실행 위치와 무관하게 고정.
name: cloudwhoareryu

services:
  # 1. FastAPI 백엔드
  backend:
    image: whoareryu/fastapi:latest
    container_name: whoareryu-backend
    ports:
      - "8000:8000"
    volumes:
      # 크롤러/스크래퍼 JSONL 산출물 — 이미지에 구워지지 않는 실행 시 산출물이라
      # 호스트(로컬 Mac 또는 원격 PC, 실행한 쪽 디스크)에 남도록 바인드 마운트한다.
      # apps/ontology/resources 전체가 아니라 이 두 폴더만 마운트 — 그렇지 않으면
      # 같은 resources/ 아래 이미지에 구워진 apps/plant/resources/plant_yolo.pt 같은
      # 파일이 가려질 위험이 있다.
      - ./apps/ontology/resources/crawled:/whoareryu/apps/ontology/resources/crawled
      - ./apps/ontology/resources/scraped:/whoareryu/apps/ontology/resources/scraped
      # 식물 진단 업로드 사진 — PLANT_S3_BUCKET(AWS API 미발급) 발급 전까지 로컬 디스크에 임시 저장.
      - ./apps/plant/resources/diagnosis_uploads:/whoareryu/apps/plant/resources/diagnosis_uploads
    env_file:
      - ./.env
    environment:
      - AUTO_CREATE_TABLES=false
      - DATABASE_URL=postgresql+asyncpg://postgres:whoareryu@pgvector:5432/whoareryu
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - OLLAMA_HOST=http://host.docker.internal:11434
      - N8N_API_URL=http://n8n:5678
      - N8N_HUB_WEBHOOK_URL=http://n8n:5678/webhook/ontology
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pgvector
      - redis
      - neo4j
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    networks:
      - app-network

  # 1-1. 인증 게이트웨이(auth.whoareryu.cloud) — backend와 같은 이미지, 다른 엔트리포인트.
  #      JWT_PRIVATE_KEY는 이 서비스의 env_file(.env.auth)에만 있다.
  auth:
    image: whoareryu/fastapi:latest
    container_name: whoareryu-auth
    command: ["sh", "-c", "pip install --quiet -r requirements.txt && exec uvicorn auth_main:app --host 0.0.0.0 --port 9000"]
    env_file:
      - ./.env
      - ./.env.auth
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:whoareryu@pgvector:5432/whoareryu
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # apps/auth/services.py가 Naver/Kakao redirect_uri를 여기서 만든다 — backend용
      # .env의 BACKEND_PUBLIC_URL(api.whoareryu.cloud)을 그대로 물려받으면 콜백
      # 주소가 틀어지므로 이 서비스에서만 auth 도메인으로 덮어쓴다.
      - BACKEND_PUBLIC_URL=https://auth.whoareryu.cloud
    depends_on:
      - pgvector
      - redis
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    networks:
      - app-network

  # 2. n8n 워크플로우 자동화
  n8n:
    image: n8nio/n8n
    container_name: whoareryu-n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - app-network

  # 3. pgvector — Relational + Vector DB (PostgreSQL 17)
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: whoareryu-pgvector
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${PGVECTOR_USER:-postgres}
      - POSTGRES_PASSWORD=${PGVECTOR_PASSWORD:-postgres}
      - POSTGRES_DB=${PGVECTOR_DB:-whoareryu}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  # 4. Redis — Cache / Queue
  redis:
    image: redis:7-alpine
    container_name: whoareryu-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app-network

  # 5. Cloudflare Named Tunnel (api.whoareryu.cloud → backend:8000)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: whoareryu-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network

  # 6. Adminer — DB 웹 GUI (localhost:8080)
  adminer:
    image: adminer
    container_name: whoareryu-adminer
    ports:
      - "8080:8080"
    depends_on:
      - pgvector
    restart: unless-stopped
    networks:
      - app-network

  # 7. Neo4j — Graph DB
  neo4j:
    image: neo4j:5
    container_name: whoareryu-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  n8n_data:
  pgvector_data:
  redis_data:
  neo4j_data:
