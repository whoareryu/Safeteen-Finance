# pgvector/neo4j/cloudflared 의 ${...} 치환값은 이 파일과 같은 경로의 .env를 자동으로 읽지 않음.
# 실행 시 명시적으로 지정: docker compose --env-file fastapi/.env -f docker-compose.backend.yaml up
services:
  # 1. FastAPI 백엔드
  backend:
    image: whoareryu/fastapi:latest
    container_name: whoareryu-backend
    ports:
      - "8000:8000"
    volumes:
      # 크롤러/스크래퍼 JSONL 산출물 — 이미지에 구워지지 않는 실행 시 산출물이라
      # 호스트(로컬 Mac 또는 원격 PC, 실행한 쪽 디스크)에 남도록 바인드 마운트한다.
      # apps/ontology/resources 전체가 아니라 이 두 폴더만 마운트 — 그렇지 않으면
      # 같은 resources/ 아래 이미지에 구워진 apps/plant/resources/plant_yolo.pt 같은
      # 파일이 가려질 위험이 있다.
      - ./fastapi/apps/ontology/resources/crawled:/whoareryu/apps/ontology/resources/crawled
      - ./fastapi/apps/ontology/resources/scraped:/whoareryu/apps/ontology/resources/scraped
      # 식물 진단 업로드 사진 — PLANT_S3_BUCKET(AWS API 미발급) 발급 전까지 로컬 디스크에 임시 저장.
      - ./fastapi/apps/plant/resources/diagnosis_uploads:/whoareryu/apps/plant/resources/diagnosis_uploads
    env_file:
      - ./fastapi/.env
    environment:
      - AUTO_CREATE_TABLES=false
      - DATABASE_URL=postgresql+asyncpg://postgres:whoareryu@pgvector:5432/whoareryu
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - OLLAMA_HOST=http://host.docker.internal:11434
      - N8N_API_URL=http://n8n:5678
      - N8N_HUB_WEBHOOK_URL=http://n8n:5678/webhook/ontology
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pgvector
      - redis
      - neo4j
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    networks:
      - app-network

  # 2. n8n 워크플로우 자동화
  n8n:
    image: n8nio/n8n
    container_name: whoareryu-n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - app-network

  # 3. pgvector — Relational + Vector DB (PostgreSQL 17)
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: whoareryu-pgvector
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${PGVECTOR_USER:-postgres}
      - POSTGRES_PASSWORD=${PGVECTOR_PASSWORD:-postgres}
      - POSTGRES_DB=${PGVECTOR_DB:-whoareryu}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  # 4. Redis — Cache / Queue
  redis:
    image: redis:7-alpine
    container_name: whoareryu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app-network

  # 5. Cloudflare Named Tunnel (api.whoareryu.cloud → backend:8000)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: whoareryu-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network

  # 6. Adminer — DB 웹 GUI (localhost:8080)
  adminer:
    image: adminer
    container_name: whoareryu-adminer
    ports:
      - "8080:8080"
    depends_on:
      - pgvector
    restart: unless-stopped
    networks:
      - app-network

  # 7. Neo4j — Graph DB
  neo4j:
    image: neo4j:5
    container_name: whoareryu-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  n8n_data:
  pgvector_data:
  redis_data:
  neo4j_data:
